name: PARADIGMA P0 Double Check
on:
  push:
    branches:
      - dev/paradigma-p0-safety-20261011
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Offline safety tests (no credentials)
        run: python -m pytest -q tests/test_p0_*.py
