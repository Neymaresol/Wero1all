name: Hotmart catalog safe simulation
on:
  pull_request:
    paths:
      - 'hotmart_catalog_gate.py'
      - 'tests/test_hotmart_catalog_gate.py'
      - '.github/workflows/hotmart-catalog-simulation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Simulate catalog gates without credentials or external calls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_hotmart_catalog_gate.py' -v
