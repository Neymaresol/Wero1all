<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wero1 Operário v1.2.0</title><style>body{font-family:system-ui;max-width:1000px;margin:40px auto;padding:0 16px}pre{background:#111;color:#eee;padding:16px;border-radius:10px;overflow:auto}.ok{font-weight:700}</style></head><body><h1>Wero1 Operário v1.2.0</h1><p class="ok">Dashboard operacional</p><h2>Status</h2><pre id="s">Carregando...</pre><h2>Funil</h2><pre id="f">Carregando...</pre><script>async function load(){for(const [id,u] of [['s','/api/status'],['f','/api/funnel']]){try{document.getElementById(id).textContent=JSON.stringify(await (await fetch(u)).json(),null,2)}catch(e){document.getElementById(id).textContent=String(e)}}}load();setInterval(load,15000)</script></body></html>
