<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wero1 Operário</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:32px auto;padding:0 16px;background:#111;color:#eee}.card{background:#1d1d1d;padding:18px;border-radius:12px;margin:12px 0}pre{white-space:pre-wrap}h1{margin-bottom:4px}</style></head><body><h1>Wero1 Operário v1.1</h1><p>Sistema de acompanhamento Hotmart</p><div class="card"><h2>Status</h2><pre id="status">Carregando...</pre></div><div class="card"><h2>Funil Hotmart</h2><pre id="funnel">Carregando...</pre></div><div class="card"><h2>Ofertas</h2><pre id="offers">Carregando...</pre></div><script>async function load(){for(const x of ['status','funnel','offers']){try{const r=await fetch('/api/'+x);document.getElementById(x).textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.getElementById(x).textContent='Erro: '+e}}}load();setInterval(load,15000)</script></body></html>
